name: Radar Rioniverso

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:         # botón para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar noticias y avisar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar/radar.py
      - name: Guardar en la base de datos
        run: |
          git config user.name "Radar Rioniverso"
          git config user.email "radar@users.noreply.github.com"
          git add docs/datos
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "Radar: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin main && git push -q && exit 0
            sleep 5
          done
          exit 1
